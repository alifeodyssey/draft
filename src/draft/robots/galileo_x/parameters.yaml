# Illustrative wheel-legged Galileo X-inspired concept, NOT measured product data.
# SI internally; installation and standing-pose degree inputs convert explicitly.
_design_provenance: "J1 JM150 / J2 JM100 / J3 JM250 supplier datasheet mass and cylindrical dimensions; user-digitized approximate curves; J4 AK70-10; user-specified 200 mm torso and outboard wheel assembly; illustrative wheel net mass/losses; trend-estimated structure and armature."

# Robot-local motor_catalog.json keeps the supplied hardware outside the paper population.
# Default joint torque limits use the 10s peak, not continuous or 3s peak torque.
# Gearbox friction/damping remain illustrative inputs, not vendor measurements.
J1_motor: JM150
J1_motor_mode: torque_speed
J1_motor_effort: 150.0
J1_motor_velocity: 15.770795121020761
J1_motor_gear: 30.0
J1_motor_friction: 0.1
J1_motor_damping: 0.01
J2_motor: JM100
J2_motor_mode: torque_speed
J2_motor_effort: 100.0
J2_motor_velocity: 16.6818569905618
J2_motor_gear: 36.0
J2_motor_friction: 0.1
J2_motor_damping: 0.01
J3_motor: JM250
J3_motor_mode: torque_speed
J3_motor_effort: 250.0
J3_motor_velocity: 15.184364492350666
J3_motor_gear: 25.0
J3_motor_friction: 0.1
J3_motor_damping: 0.01
J4_motor: AK70-10
J4_motor_mode: torque_speed
J4_motor_effort: 24.0
J4_motor_velocity: 32.46
J4_motor_gear: 10.0
J4_motor_friction: 0.1
J4_motor_damping: 0.01
allow_hypothetical: false
j1_mot: J1
j2_mot: J2
j3_mot: J3
j4_mot: J4
j1_range: [-2.5, 2.5]
j2_range: [-1.5707963267948966, 1.5707963267948966]
# Negative: existing knee flexion; zero: straight; positive: reverse flexion.
j3_range: [-2.8, 1.5707963267948966]

# Illustrative lengths [m]: thigh from the canted mount to knee axis;
# shank from knee axis to wheel axis (perpendicular distance between axes).
# Latest saved design: galileo_x_20261123_135703. Offsets are additional.
torso_lx: 0.5
torso_ly: 0.30
torso_lz: 0.20
torso_chamfer: 0.35
upper_leg_link_length: 0.24
lower_leg_link_length: 0.23
thigh_cant_deg: 30.0
thigh_cant_rad: ${thigh_cant_deg * pi / 180}
# User-specified nominal J1 angle; knee default is an illustrative crouch.
# These are poses, not changes to the mechanical zero or joint travel.
standing_j1_deg: -20.0
standing_j1_rad: ${standing_j1_deg * pi / 180}
standing_j3_deg: ${2 * (standing_j1_deg - thigh_cant_deg)}
standing_j3_rad: ${standing_j3_deg * pi / 180}
assembly_clearance: 0.005
link_motor_penetration: 0.005
link_render_radius_scale: 0.70
lower_leg_render_scale: 0.8
# Illustrative wheel inputs; net wheel mass excludes the complete J4 motor.
wheel_tire_thickness: 0.015
wheel_mass: 0.5
wheel_friction: 0.7 0.005 0.0001
# Geometric sitting inspection, not a controller or a new standing pose.
sitting_j1_deg: -140.0
sitting_j3_deg: -145.0
sitting_lift_height: 0.05

# Trend-owned density declarations; values below are replaced and recorded.
mass_composition_reference: quadruped
torso_rho: 654.0
thigh_rho: 345.0
shank_rho: 637.1
motor_rho: 2700.0

# Envelope-derived assembly, not measured dimensions. J1 housings sit beyond
# the front/rear end faces, with their axial envelopes inside the torso width.
# The coaxial abduction member still carries the J2 stator outwards along y.
j1_mount_x: ${torso_lx / 2 + j1_motor_r + assembly_clearance}
j1_mount_y: ${torso_ly / 2 - j1_motor_L / 2 - assembly_clearance}
# Also clear the J3 housing from the thicker torso throughout the folded pose.
hip_abduction_link_length: ${j1_motor_L / 2 + max(j2_motor_r + assembly_clearance, j3_motor_L / 2 + 2 * assembly_clearance)}
hip_link_render_r: ${min(j1_motor_r, j2_motor_r, j2_motor_L / 2) * link_render_radius_scale}
upper_leg_link_render_r: ${min(j3_motor_r, j3_motor_L / 2) * link_render_radius_scale}
lower_leg_link_render_r: ${upper_leg_link_render_r * lower_leg_render_scale}
wheel_radius: ${j4_motor_r + assembly_clearance + wheel_tire_thickness}
wheel_width: ${j4_motor_L + 2 * assembly_clearance}
# J1's height remains the torso centreline (tree mounting z=0).
# Shank clears the outer J3 face; J4 and wheel clear the outer shank face.
shank_outboard_offset: ${j3_motor_L / 2 + assembly_clearance + lower_leg_link_render_r}
j4_outboard_offset: ${lower_leg_link_render_r + assembly_clearance + wheel_width / 2}
j4_housing_link_length: ${j4_outboard_offset + j4_motor_L / 2}
# Clear the J2 output face even at the edge of the canted structural cylinder.
j2_output_offset: ${j2_motor_L / 2 + upper_leg_link_render_r * abs(sin(thigh_cant_rad)) + assembly_clearance}
thigh_joint_span: ${sqrt(upper_leg_link_length ** 2 + j2_output_offset ** 2 + 2 * upper_leg_link_length * j2_output_offset * cos(thigh_cant_rad))}
size_metric_expr: ${thigh_joint_span + lower_leg_link_length}
standing_height: ${j2_output_offset + (upper_leg_link_length + lower_leg_link_length) * cos(thigh_cant_rad) + wheel_radius}
standing_pose_height: ${j2_output_offset * cos(standing_j1_rad) + upper_leg_link_length * cos(thigh_cant_rad - standing_j1_rad) + lower_leg_link_length * cos(thigh_cant_rad - standing_j1_rad + standing_j3_rad) + wheel_radius}

# sx only selects the front/rear mount; all knees share the rearward layout.
# sy selects left/right placement and mirrored yaw commands.
_legs:
  - {name: fl, sx: 1, sy: 1}
  - {name: fr, sx: 1, sy: -1}
  - {name: rl, sx: -1, sy: 1}
  - {name: rr, sx: -1, sy: -1}

link_color: 0.294 0.447 0.686 1.0
motor_color: 0.161 0.243 0.376 1.0
mot_detail_color: 0.067 0.102 0.161 1.0
torso_color: 0.294 0.447 0.686 1.0
wheel_color: 0.055 0.065 0.080 1.0
